<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number System Universe 🌈✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Mali', cursive !important; }
        body { background: linear-gradient(135deg, #fce7f3 0%, #f3e8ff 50%, #e0f2fe 100%); color: #4c1d95; min-height: 100vh; }
        .cute-shadow { box-shadow: 0 10px 40px -10px rgba(168, 85, 247, 0.2); }
        .card-hover { transition: all 0.3s; }
        .card-hover:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="p-4 md:p-8 lg:p-12 max-w-5xl mx-auto flex flex-col items-center justify-center min-h-screen">

    <!-- แถบแสดงสถานะผู้ใช้ด้านบน -->
    <div id="user-info-bar" class="w-full flex justify-end items-center mb-8 hidden gap-2">
        <span id="user-email-display" class="bg-white/80 px-4 py-2 rounded-full font-bold shadow-sm text-sm"></span>
        <span id="user-role-display" class="bg-purple-500 text-white px-4 py-2 rounded-full font-bold shadow-sm text-sm"></span>
        <button onclick="logout()" class="bg-red-400 text-white px-4 py-2 rounded-full font-bold hover:bg-red-500 transition text-sm shadow-sm">ออกจากระบบ</button>
    </div>
    <div id="login-prompt-bar" class="w-full flex justify-end mb-8">
        <a href="auth.html" class="bg-gradient-to-r from-purple-500 to-pink-500 text-white px-6 py-2 rounded-full font-bold shadow-md hover:scale-105 transition">เข้าสู่ระบบ / สมัครสมาชิก 🚀</a>
    </div>

    <!-- ส่วนหัวหน้าเว็บ (Header) -->
    <header class="text-center mb-10 w-full relative">
        <span class="inline-block px-6 py-2 bg-white/80 text-purple-600 rounded-full text-lg font-bold mb-4 shadow-sm border border-purple-100">✨ ยินดีต้อนรับสู่โลกของตัวเลข ✨</span>
        <h1 class="text-4xl md:text-6xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-pink-500 via-purple-500 to-blue-500 py-2">Number System Universe</h1>
    </header>

    <!-- เมนูเลือกฐาน (เปลี่ยนเป็นปุ่มไปหน้าต่างๆ) -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 w-full mb-12">
        <a href="base2.html" class="block group">
            <div class="h-full bg-white rounded-[2rem] p-8 border-2 border-pink-200 card-hover text-center relative overflow-hidden">
                <div class="text-6xl mb-4 group-hover:scale-110 transition-transform">🐰</div>
                <h3 class="text-2xl font-bold text-rose-600 mb-2">ระบบเลขฐาน 2</h3>
                <div class="mt-4 bg-pink-500 text-white px-6 py-2 rounded-full font-bold inline-block">ไปลุยกันเลย!</div>
            </div>
        </a>
        <a href="base8.html" class="block group">
            <div class="h-full bg-white rounded-[2rem] p-8 border-2 border-purple-200 card-hover text-center relative overflow-hidden">
                <div class="text-6xl mb-4 group-hover:scale-110 transition-transform">🍇</div>
                <h3 class="text-2xl font-bold text-purple-600 mb-2">ระบบเลขฐาน 8</h3>
                <div class="mt-4 bg-purple-500 text-white px-6 py-2 rounded-full font-bold inline-block">ไปลุยกันเลย!</div>
            </div>
        </a>
        <a href="base16.html" class="block group">
            <div class="h-full bg-white rounded-[2rem] p-8 border-2 border-blue-200 card-hover text-center relative overflow-hidden">
                <div class="text-6xl mb-4 group-hover:scale-110 transition-transform">☁️</div>
                <h3 class="text-2xl font-bold text-blue-600 mb-2">ระบบเลขฐาน 16</h3>
                <div class="mt-4 bg-blue-500 text-white px-6 py-2 rounded-full font-bold inline-block">ไปลุยกันเลย!</div>
            </div>
        </a>
    </div>

    <!-- Script สำหรับ Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // เดี๋ยวเราจะเอา URL และ KEY มาใส่ตรงนี้ในขั้นตอนที่ 3
        const supabaseUrl = 'sb_publishable_HNZVbY2JDt0ws-k96--cBA_o8xzYiZG';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR4YXFpb2Vsb3lycXJ3anBsZXZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NzA3NjIsImV4cCI6MjEwNjM0Njc2Mn0.dGK09fDmmQbcN7a3AgVBk3MUqAS-ZNrtZ6YCsEpCczU';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function checkUser() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                document.getElementById('login-prompt-bar').classList.add('hidden');
                document.getElementById('user-info-bar').classList.remove('hidden');
                document.getElementById('user-email-display').innerText = '👤 ' + session.user.email;

                // ดึงข้อมูลบทบาท (Role)
                const { data: profile } = await supabase.from('user_profiles').select('role').eq('id', session.user.id).single();
                if (profile) {
                    const roleText = profile.role === 'teacher' ? '👩‍🏫 ครู/อาจารย์' : '🎓 นักศึกษา';
                    document.getElementById('user-role-display').innerText = roleText;
                }
            }
        }

        async function logout() {
            await supabase.auth.signOut();
            window.location.reload();
        }

        checkUser();
    </script>
</body>
</html>
